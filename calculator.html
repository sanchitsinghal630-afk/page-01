<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanchit Calculator - Free Online Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div id="body">
        <p id="old">0</p>
        <input type="text" id="entry" readonly>
        <div>
            <button id="ac" class="operator">AC</button>
            <button id="de" class="operator">DE</button>
            <button id="modulus" class="operator">%</button>
            <button id="divide" class="operator">/</button>
        </div>
        <div>
            <button id="seven">7</button>
            <button id="eight">8</button>
            <button id="nine">9</button>
            <button id="multiply" class="operator">*</button>
        </div>
        <div>
            <button id="four">4</button>
            <button id="five">5</button>
            <button id="six">6</button>
            <button id="minus" class="operator">-</button>
        </div>
        <div>
            <button id="one">1</button>
            <button id="two">2</button>
            <button id="three">3</button>
            <button id="plus" class="operator">+</button>
        </div>
        <div>
            <button id="double_zero">00</button>
            <button id="zero">0</button>
            <button id="dot">.</button>
            <button id="equal">=</button>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
